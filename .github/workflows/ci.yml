name: Cross-platform
on: [push, pull_request, workflow_dispatch]
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - run: cargo build --locked
      - run: python tests/platform_smoke.py
      - if: runner.os == 'Linux'
        run: |
          python3 tests/integration.py
          python3 tests/responsiveness.py
          python3 tests/manager_pty.py
          python3 tests/model_picker_pty.py
          python3 tests/search_integration.py
          python3 tests/workspace_pty.py
          python3 tests/activity_pty.py
          python3 tests/rename_compat.py
          python3 tests/pty_smoke.py
      - if: runner.os == 'macOS'
        env:
          TMPDIR: /tmp
        run: |
          python3 tests/integration.py
          python3 tests/pty_smoke.py
      - if: runner.os != 'Windows'
        run: sh scripts/build.sh
      - if: runner.os == 'Windows'
        run: ./scripts/build.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: codex-deck-${{ runner.os }}-${{ runner.arch }}
          path: bin/codex-deck-*
