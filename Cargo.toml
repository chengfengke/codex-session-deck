[package]
name = "codex-deck"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
description = "A persistent multi-session terminal workspace for Codex"
license = "MIT"

[dependencies]
anyhow = "1"
crossterm = { version = "0.28", features = ["event-stream"] }
libc = "0.2"
ratatui = { version = "0.29", features = ["unstable-rendered-line-info"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
unicode-segmentation = "1"
unicode-width = "0.2"

[profile.release]
lto = "thin"
strip = true
